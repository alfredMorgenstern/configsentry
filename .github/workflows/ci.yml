name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  action-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs the composite action from this repo (path) against the example file.
      - uses: ./. 
        with:
          target: ./example.docker-compose.yml
          sarif: true
          upload-sarif: false
          fail-on-findings: false

      - uses: actions/upload-artifact@v4
        with:
          name: configsentry-sarif-example
          path: configsentry.sarif.json
