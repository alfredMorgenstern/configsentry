# Example: how a different repo would use ConfigSentry as an action.
# Copy into your own project and adjust the compose file path.

name: Compose lint (ConfigSentry) — example workflow

# This file is an EXAMPLE for other repos.
# It is intentionally NOT run on every push in this repo to avoid noisy notifications.

on:
  workflow_dispatch:

jobs:
  configsentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the action from this repo (pin to a tag)
      - uses: alfredMorgenstern/configsentry@v0.0.7
        with:
          compose-file: docker-compose.yml
          sarif: true
          upload-sarif: false
          fail-on-findings: false
