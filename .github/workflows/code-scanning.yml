name: ConfigSentry Code Scanning
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  configsentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run the composite action from this repo and upload SARIF to Code Scanning.
      - uses: ./. 
        with:
          target: ./example.docker-compose.yml
          sarif: true
          upload-sarif: true
          fail-on-findings: false
