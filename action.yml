name: "ConfigSentry"
description: "Lint docker-compose.yml for high-impact security + ops footguns"
author: "Marius Morgenstern"
branding:
  icon: "shield"
  color: "blue"

inputs:
  target:
    description: "File or directory to scan (compose file or folder containing compose files)"
    required: false
    default: "."
  compose-file:
    description: "Deprecated: use target instead"
    required: false
    default: "docker-compose.yml"
  sarif:
    description: "If true, generate SARIF"
    required: false
    default: "true"
  upload-sarif:
    description: "If true, upload SARIF to GitHub Code Scanning (requires permissions: security-events: write)"
    required: false
    default: "false"
  fail-on-findings:
    description: "If true, fail the action when findings exist (recommended for CI gating)."
    required: false
    default: "true"
  baseline:
    description: "Optional baseline file path (suppresses known findings)"
    required: false
    default: ""
  write-baseline:
    description: "Optional path to write a baseline file (does not fail)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install
      shell: bash
      run: npm ci

    - name: Build
      shell: bash
      run: npm run build

    - name: Run ConfigSentry
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        # Back-compat: if target is unset/blank, fall back to compose-file.
        if [[ -z "$TARGET" ]]; then TARGET="${{ inputs.compose-file }}"; fi

        BASELINE="${{ inputs.baseline }}"
        WRITE_BASELINE="${{ inputs.write-baseline }}"

        FLAGS=()
        if [[ -n "$BASELINE" ]]; then FLAGS+=("--baseline" "$BASELINE"); fi
        if [[ -n "$WRITE_BASELINE" ]]; then FLAGS+=("--write-baseline" "$WRITE_BASELINE"); fi

        if [[ "${{ inputs.sarif }}" == "true" ]]; then
          # Always generate SARIF when requested.
          node dist/cli.js "$TARGET" --sarif "${FLAGS[@]}" > configsentry.sarif.json || true
        fi

        # If we're writing a baseline, never fail.
        if [[ -n "$WRITE_BASELINE" ]]; then
          node dist/cli.js "$TARGET" "${FLAGS[@]}" || true
          exit 0
        fi

        # Control whether findings should fail the job.
        if [[ "${{ inputs.fail-on-findings }}" == "true" ]]; then
          node dist/cli.js "$TARGET" "${FLAGS[@]}"
        else
          node dist/cli.js "$TARGET" "${FLAGS[@]}" || true
        fi

    - name: Upload SARIF artifact
      if: ${{ inputs.sarif == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: configsentry-sarif
        path: configsentry.sarif.json

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.sarif == 'true' && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: configsentry.sarif.json
