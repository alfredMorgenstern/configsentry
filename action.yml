name: "ConfigSentry"
description: "Lint docker-compose.yml for high-impact security + ops footguns"
author: "Marius Morgenstern"
branding:
  icon: "shield"
  color: "blue"

inputs:
  compose-file:
    description: "Path to docker-compose.yml"
    required: false
    default: "docker-compose.yml"
  sarif:
    description: "If true, generate SARIF"
    required: false
    default: "true"
  upload-sarif:
    description: "If true, upload SARIF to GitHub Code Scanning (requires permissions: security-events: write)"
    required: false
    default: "false"
  fail-on-findings:
    description: "If true, fail the action when findings exist (recommended for CI gating)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install
      shell: bash
      run: npm ci

    - name: Build
      shell: bash
      run: npm run build

    - name: Run ConfigSentry
      shell: bash
      run: |
        set -euo pipefail
        FILE="${{ inputs.compose-file }}"

        if [[ "${{ inputs.sarif }}" == "true" ]]; then
          # Always generate SARIF when requested.
          node dist/cli.js "$FILE" --sarif > configsentry.sarif.json || true
        fi

        # Control whether findings should fail the job.
        if [[ "${{ inputs.fail-on-findings }}" == "true" ]]; then
          node dist/cli.js "$FILE"
        else
          node dist/cli.js "$FILE" || true
        fi

    - name: Upload SARIF artifact
      if: ${{ inputs.sarif == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: configsentry-sarif
        path: configsentry.sarif.json

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.sarif == 'true' && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: configsentry.sarif.json
